name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run that is still going
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A stalled download fails the run instead of holding it for the default 6 hours
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: windows-latest
            bundles: nsis

    steps:
      - uses: actions/checkout@v7

      # The downloaded packages are cached, so a run only downloads what changed since the last
      # one. The key changes every week, so security updates are picked up.
      - name: Week for the package cache (Linux)
        if: runner.os == 'Linux'
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache system packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ steps.week.outputs.week }}
          restore-keys: apt-${{ runner.os }}-

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        # The Ubuntu mirror is sometimes very slow: retry stalled downloads instead of waiting
        timeout-minutes: 15
        run: |
          # The runner's Azure mirror stalls for minutes at a time; the main archive does not
          grep -rl azure.archive.ubuntu.com /etc/apt/sources.list /etc/apt/sources.list.d \
            | xargs -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Sandbox::User=root \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
          # apt leaves a root-only lock file, which the cache cannot read
          sudo rm -rf ~/apt-archives/lock ~/apt-archives/partial
          sudo chown -R "$USER" ~/apt-archives

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run check

      - name: Lint frontend
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Tauri build
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: simplecalendar-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/simple-calendar.exe
          if-no-files-found: error
          retention-days: 14
