# src-tauri/ is a Cargo workspace: this app crate at the root, calendar logic in crates/core.
# The app crate is a member automatically. CI runs fmt, clippy and tests with --workspace/--all.
[workspace]
members = ["crates/core"]
resolver = "3"

# Shared by every member through `<key>.workspace = true`
[workspace.package]
authors = ["Adriaan"]
license = "MIT"
repository = "https://github.com/Adriaan-Cloet/SimpleCalendar"
edition = "2024"
rust-version = "1.95"

[package]
name = "simple-calendar"
version = "0.1.0"
description = "A simple calendar desktop app"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "simple_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
# Desktop notifications for reminders (§9, §11), shown from Rust only. 2.7 reports a click on a
# notification on Linux and Windows, which opens the event. On Linux it talks D-Bus through
# `zbus` (about 35 crates, pure Rust), on Windows through WinRT.
tauri-plugin-notification = "2.7"
# Opens the system browser for Google sign-in (§8, §11). The crate `tauri-plugin-opener` uses
# for this; the plugin itself would add `zbus` and 30 more crates on Linux for "reveal in
# folder". `shellexecute-on-windows` opens through ShellExecuteW instead of `cmd /c start`,
# which would split the URL at its `&`s, as the plugin does; its `dunce` is already built.
open = { version = "5", features = ["shellexecute-on-windows"] }
simplecalendar-core = { path = "crates/core" }
# The channel that carries `CoreEvent`s from the core to the event forwarder. Already built
# through Tauri, which runs on tokio.
tokio = { version = "1", features = ["sync"] }
