[package]
name = "simplecalendar-core"
version = "0.1.0"
description = "Calendar logic for SimpleCalendar: model, storage, recurrence, sync"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Never add `tauri` here. The core stays free of the UI shell, so its tests build without
# WebKit and the same crate can sit behind a mobile shell later (docs/architecture.md §3).
[dependencies]
# Async methods on the provider traits, which the sync engine calls through `dyn` (§5). Native
# `async fn` in traits is still not dyn-compatible on rustc 1.99 (§13 point 2).
async-trait = "0.1"
# Dates and times. Already built through Tauri; `rrule` is built on it (§11).
chrono = "0.4"
# The IANA zone database, embedded: Windows does not ship one. Same major as `rrule` uses.
chrono-tz = "0.10"
log = "0.4"
# The OS keychain API (§8). The platform store crates below plug into it.
keyring-core = "1"
# Recurrence expansion (RFC 5545). Only used inside `recurrence::expand`. Its `regex`
# dependency is already built through Tauri.
rrule = "0.14"
# The keychain value is a small versioned JSON document (§8). Both already built through Tauri.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite compiled into the binary: the same version on Ubuntu and Windows (§11).
rusqlite = { version = "0.40", features = ["bundled"] }
# Schema migrations, versioned in `PRAGMA user_version`.
rusqlite_migration = "2.6"
thiserror = "2"
# `spawn_blocking` for the blocking SQLite calls, channels for the sync engine. Already built
# through Tauri. `time` (the sync timer) is the only feature Tauri does not enable already.
tokio = { version = "1", features = ["rt", "sync", "time"] }

# Secret Service over D-Bus (GNOME Keyring, KWallet). `libdbus` is already built through Tauri.
# The crate requires a crypto backend for the encrypted session; `crypto-rust` keeps the app on
# one pure-Rust crypto stack, the same choice as rustls for HTTPS later (§13 point 1).
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# Windows Credential Manager. Its default `search` feature is not used.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[dev-dependencies]
tempfile = "3"
# `test-util` pauses the clock, so the 60-minute sync timer is tested without waiting.
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
